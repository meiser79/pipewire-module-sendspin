# Standalone Sendspin client process.
#
# Runs the module in its own process as a regular PipeWire client instead of
# inside the daemon:
#
#   pipewire -c /path/to/sendspin-client.conf
#
# (a relative name is looked up in ~/.config/pipewire/ and /usr/share/pipewire/).
# Useful for testing, for several clients with different settings, or to keep
# the network-facing code out of the PipeWire daemon.

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { nice.level = -11 }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-sendspin
        args = {
            #sendspin.name   = "Sendspin PipeWire"
            #sendspin.port   = 8928
            sendspin.player = true
            sendspin.source = true
        }
    }
]
