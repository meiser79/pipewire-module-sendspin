# ~/.config/pipewire/pipewire.conf.d/sendspin.conf
#
# Loads the Sendspin client into the PipeWire daemon. Drop this file into
# ~/.config/pipewire/pipewire.conf.d/ and run:  systemctl --user restart pipewire
#
# Every key is optional. The roles are switched independently:
#   sendspin.player   = player@v1   (Music Assistant plays to this computer)
#   sendspin.source   = source@v1   (an output device whose audio becomes a Live Input)

context.modules = [
  {
    name  = libpipewire-module-sendspin
    flags = [ ifexists nofail ]
    args  = {
      # ---- identity / network -------------------------------------------
      # Friendly name shown in Music Assistant (default: the hostname).
      #sendspin.name      = "Living Room PC"
      # Instance id; names the default state file (default: "pipewire-" + first
      # 12 chars of machine-id). The protocol client id is derived from the
      # identity key stored in the state file.
      #sendspin.client-id = "pipewire-livingroom"
      # WebSocket port the server connects to (default 8928). Must be unique
      # per client on this host.
      #sendspin.port      = 8928
      # Advertise _sendspin._tcp over Avahi (default true).
      #sendspin.mdns      = true
      # Pairing keys etc. (default $XDG_STATE_HOME/pipewire-module-sendspin/<id>.state)
      #sendspin.state-file = "/home/me/.local/state/pipewire-module-sendspin/pc.state"
      # Let unpaired servers play / start roles (default: true when the player
      # is on). Paired servers are always admitted.
      #sendspin.unpaired-access = true
      #sendspin.log-level = info     # none|error|warn|info|debug|verbose (sendspin-cpp: errors only below debug)

      # ---- player@v1 (+ metadata@v1) ------------------------------------
      sendspin.player   = true
      # Desktop media controls (MPRIS): show title/artist/cover/position and
      # send play/pause/next/seek/volume to the server (controller@v1).
      #sendspin.mpris = true
      # Codec preference order (default flac,opus,pcm).
      #sendspin.player.codecs = "flac,opus,pcm"
      # Initial output delay in ms (the server can change it; it is remembered).
      #sendspin.player.static-delay-ms = 0
      # Extra properties for the playback stream, e.g. a fixed output device:
      #player.props = { target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo" }

      # ---- source@v1 ----------------------------------------------------
      sendspin.source = true
      # Codec of the input stream: pcm, flac or opus (default pcm). A server that
      # does not accept the codec gets PCM.
      #sendspin.source.codec = pcm
      # By default the source is an output device "<server name> [Sendspin]":
      # whatever applications play to it becomes the Live Input. Set to false
      # to record the default input device (or source.props' target) instead.
      #sendspin.source.virtual-sink = true
      # Capture what this computer plays (default sink monitor) instead.
      # Turns the virtual sink off unless virtual-sink = true is set as well.
      #sendspin.source.capture-sink = false
      # The input always reports whether it has a signal; without detection it
      # reports none, so Music Assistant starts it only when asked to. With
      # detection the signal follows the input's level, so Music Assistant can
      # start and stop playback on its own. Keeps the input open permanently.
      #sendspin.source.signal-detect = false
      #sendspin.source.signal.threshold-db = -50   # RMS level, dBFS
      #sendspin.source.signal.attack-ms    = 300   # above it this long: present
      #sendspin.source.signal.release-ms   = 5000  # below it this long: absent
      # Extra properties for the capture stream, e.g. a fixed input:
      #source.props = { target.object = "alsa_input.usb-Behringer_UCA222-00.analog-stereo" }
    }
  }
]
